name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source archive
        run: git archive --format=tar.gz --prefix="lucida-flutter-${GITHUB_REF_NAME}/" -o "lucida-flutter-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "lucida-flutter-*.tar.gz"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lucida-flutter-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
  # pub.dev automated publishing (OIDC): enable it for both packages with tag pattern v{{version}}.
  publish-core:
    needs: release
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: lucida_core
      use-flutter: false
  publish-flutter:
    needs: publish-core
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: lucida_flutter
